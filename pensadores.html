<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Lexend:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/acess.js"></script>
<link rel="icon" href="mesa/img/triboulet_pin.jpg">
<title>Os pensadores</title>
</head>
<body class="brilho">
<main class="wrap">
  <section class="painel"><h1 data-t="pens_title"></h1><p data-t="pens_intro"></p><p class="nota" data-t="content_pt"></p>
    <div class="estilos" role="group"><button type="button" data-e="" aria-pressed="false" data-t="st_light"></button><button type="button" data-e="lc/" aria-pressed="true" data-t="st_dark"></button></div>
    <div class="grade" id="grade"></div></section>
</main>
<script src="assets/site.js"></script>
<script>
(function(){
  /* botão só das fotos: troca os retratos entre o estilo claro e o escuro (padrão: escuro); a página não muda */
  var est='lc/'; try{ if(localStorage.getItem('fotos_estilo')==='claro') est=''; }catch(e){}
  var EL=null, DND=null, g=document.getElementById('grade');
  function pintar(){
    if(!EL||!DND) return; g.textContent='';
    EL.forEach(function(p){
      var d=DND[p.id]||{}, a=document.createElement('a'); a.className='card'; a.href='pensador.html?id='+p.id;
      var i=document.createElement('img'); i.src='mesa/img/'+est+p.img+'.jpg'; i.alt=p.nome; i.loading='lazy'; i.width=240; i.height=240;
      var f=document.createElement('div'); f.className='info'; var b=document.createElement('b'); b.textContent=p.nome; var s=document.createElement('span'); s.textContent=d.classe||'';
      f.appendChild(b); f.appendChild(s); a.appendChild(i); a.appendChild(f); g.appendChild(a);
    });
  }
  function marcarBt(){ document.querySelectorAll('.estilos button').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.e===est)); }); }
  document.querySelectorAll('.estilos button').forEach(function(b){ b.addEventListener('click',function(){ est=b.dataset.e; try{ localStorage.setItem('fotos_estilo',est?'escuro':'claro'); }catch(e){} marcarBt(); pintar(); }); });
  marcarBt();
  Promise.all([fetch('mesa/data/elenco.json').then(function(r){ return r.json(); }),fetch('mesa/data/dnd.json').then(function(r){ return r.json(); })]).then(function(v){
    EL=v[0].elenco.concat([{id:'triboulet',nome:'Triboulet',img:'triboulet'}]); DND=v[1].fichas; pintar(); });
})();
</script>
</body>
</html>
